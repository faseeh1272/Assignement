

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
.container{
  width: 300px;
  margin: 0 auto;
  border: 2px solid black;
  height: 600px;
  border-radius: 15px;
  padding: 10px;
  background-color: black;
}
nav h1 {
  background-color: white;
  text-align: center;
  border: 2px solid black;
  border-radius: 10px;
  padding: 10px;
}
p {
  text-align: end;
  font-size:30px;
  margin-right: 10px;
  color: white;
}
.flex{
  display:flex;
  align-items:center;
  justify-content: space-between;
}
.one{
  background-color: yellow;
  padding: 25px 25px;
  border-radius: 50%;
  color: white;
}
.a{
    background-color: #9A9A9A;
}
.arrow{
    background-color: #9A9A9A;
}
.per{
    background-color: #9A9A9A;
}
.did{
    background-color: #EF9408;
}
.multi{
    background-color: #EF9408;
}
.minus{
    background-color: #EF9408;
}
.plus{
    background-color: #EF9408;
}
.equal{
    background-color: #EF9408;
}
.scolor{
    background-color: #2F2F2F;
}
</style>
<body>
  <div>
    <div class="container">
      <nav>
        <h1>Welcome to calculator</h1>
      </nav>
      <div>
        <p>0</p>
      </div>
      <div class="flex">
        <div class="one a">AC</div>
        <div class="one arrow "><i class="fa-solid fa-arrow-left"></i></div>
        <div class="one per">%</div>
        <div class="one did"><i class="fa-solid fa-divide"></i></div>
      </div> 
      <br>
      <div class="flex">
        <div class="one scolor">7</div>
        <div class="one scolor">8</div>
        <div class="one scolor">9</div>
        <div class="one multi"><i class="fa-solid fa-xmark"></i></div>
      </div> 
      <br>
      <div class="flex">
        <div class="one scolor">4</div>
        <div class="one scolor">5</i></div>
        <div class="one scolor">6</div>
        <div class="one minus"><i class="fa-solid fa-minus"></i></div>
      </div> 
      <br>
      <div class="flex">
        <div class="one scolor"><i class="fa-solid fa-1"></i></div>
        <div class="one scolor">2</i></div>
        <div class="one scolor">3</div>
        <div class="one plus"><i class="fa-solid fa-plus"></i></div>
      </div> 
      <br>
      <div class="flex">
        <div class="one scolor"><i class="fa-solid fa-0"></i></div>
        <div class="one scolor"><i class="fa-solid fa-0"></i></div>
        <div class="one scolor">.</div>
        <div  class="one equal">=</div>
      </div> 
    </div>
  </div> 
  <h1>
    
  </h1>
</body>
</html>
