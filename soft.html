<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>softgray</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header{
            width: 100%;
         background-color: white;
         border: 2px solid black;
         display: flex;
         justify-content: space-between;
         padding: 10px 20px;
         align-items: center;
        }
        h1{
            margin-right: 20px;
        }
        .logo{
            display: flex;
            align-items: center;
            font-weight: bold;
            color: black;
        }
        ul{
            list-style-type: none;
            display: flex;
            margin: 0;
        }
        ul li{
            margin: 0 10px;      
        }
        ul li a{
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        ul li a:hover{
            background-color: aqua;
        }
        .contact{
            font-weight: bold;
            text-align: end;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>SOFTGRAY</h1>
        </div>
        <ul>
            <li><a href="#">Products</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Jobs</a></li>
            <li><a href="#">contact</a></li>
        </ul>
        <div class="contact">
            <span>+81-00-0000-0000</span>
        </div>
    </header>

</body>
</html>
